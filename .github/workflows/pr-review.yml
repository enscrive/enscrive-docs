name: pr-review

# Bootstrap A retains pull_request for this installation PR only. After merge,
# Bootstrap B removes that trigger; pull_request_target then loads this workflow
# and its helper exclusively from the protected base revision.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  # During Bootstrap A both event types exist. Separating them prevents a
  # skipped legacy event from cancelling the authoritative target event.
  group: trusted-pr-review-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-control:
    name: review-control
    if: >-
      github.event.pull_request.draft == false &&
      (github.event_name == 'pull_request_target' ||
       github.event.pull_request.number == 27)
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out review control
        uses: actions/checkout@v4
        with:
          # Bootstrap A is the sole legacy exception: main cannot supply a
          # helper it does not contain yet. Permanent pull_request_target runs
          # always select the exact base SHA and never execute PR code.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create required check on the PR head
        id: head_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=review \
            -f head_sha="$EXPECTED_HEAD_SHA" \
            -f status=in_progress \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f external_id="pr-review:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${PR}:${EXPECTED_HEAD_SHA}")
          check_id=$(jq -er '.id' <<<"$response")
          echo "id=$check_id" >> "$GITHUB_OUTPUT"

      - name: Require reviewer configuration
        id: config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_ID: ${{ secrets.REVIEWER_APP_ID }}
          APP_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${ANTHROPIC_API_KEY:-}"
          test -n "${APP_ID:-}"
          test -n "${APP_KEY:-}"

      - name: Review control self-test
        run: TRUSTED_PR_REVIEW_SELFTEST=1 bash .github/scripts/trusted-pr-review.sh

      - name: Mint reviewer App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.270

      - name: Run exact-head independent review
        id: reviewer
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEWER_BOT_LOGIN: ${{ steps.app_token.outputs.app-slug }}[bot]
          DIFF_CHAR_CAP: "120000"
        run: bash .github/scripts/trusted-pr-review.sh

      - name: Finalize required head check
        if: always() && steps.head_check.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.head_check.outputs.id }}
          REVIEW_OUTCOME: ${{ steps.reviewer.outcome }}
        run: |
          set -euo pipefail
          conclusion=failure
          summary="Independent review did not complete for the exact PR head."
          if [ "$REVIEW_OUTCOME" = success ]; then
            conclusion=success
            summary="Independent review completed and posted a verdict on the exact PR head."
          fi
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_ID}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=Exact-head Claude review" \
            -f "output[summary]=$summary" >/dev/null
