name: release

on:
    push:
      tags:
        - "v*"
    workflow_dispatch:
      inputs:
        ref_name:
          description: "Tag or ref name to use for the artifact path (e.g. v0.1.0)."
          required: true
          type: string

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::535002853127:role/enscrive-releases-publisher
  S3_BUCKET: enscrive-install-artifacts-dev
  CF_DISTRIBUTION_ID: EWE9BH1POOS0A
  CHANNEL: dev
  BINARY_NAME: enscrive-docs

# Release artifacts use keyless cosign signing through GitHub Actions OIDC.
# Provisioning pins this repository's release.yml identity and fails closed
# when the per-binary .bundle is absent or invalid.

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-${{ matrix.target }}-

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --locked --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${BINARY_NAME}"
          DST="dist/${BINARY_NAME}-${{ matrix.target }}"
          cp "$SRC" "$DST"
          chmod +x "$DST"
          ls -lh "$DST"

      - name: Compute SHA256 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "${BINARY_NAME}-${{ matrix.target }}" > "${BINARY_NAME}-${{ matrix.target }}.sha256"
          cat "${BINARY_NAME}-${{ matrix.target }}.sha256"

      - name: Compute SHA256 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "${BINARY_NAME}-${{ matrix.target }}" > "${BINARY_NAME}-${{ matrix.target }}.sha256"
          cat "${BINARY_NAME}-${{ matrix.target }}.sha256"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload binary to S3
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          aws s3 cp \
            "dist/${BINARY_NAME}-${TARGET}" \
            "s3://${S3_BUCKET}/releases/${CHANNEL}/${TAG}/${TARGET}/${BINARY_NAME}" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp \
            "dist/${BINARY_NAME}-${TARGET}.sha256" \
            "s3://${S3_BUCKET}/releases/${CHANNEL}/${TAG}/${TARGET}/${BINARY_NAME}.sha256" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload artifact for aggregation
        uses: actions/upload-artifact@v4
        with:
          name: enscrive-docs-${{ matrix.target }}
          path: |
            dist/${{ env.BINARY_NAME }}-${{ matrix.target }}
            dist/${{ env.BINARY_NAME }}-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: aggregate + release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts and produce SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name "${BINARY_NAME}-*" ! -name "*.sha256" -exec cp {} dist/ \;
          ls -lh dist/
          cd dist
          : > SHA256SUMS
          for f in ${BINARY_NAME}-*; do
            [[ "$f" == *.sha256 ]] && continue
            [[ "$f" == "SHA256SUMS" ]] && continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload canonical and compatibility SHA256SUMS to S3
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          CANONICAL_KEY="releases/${CHANNEL}/${TAG}/${BINARY_NAME}/SHA256SUMS"

          # The binary-name segment makes this checksum index unambiguous when
          # independently tagged repositories choose the same minute-based tag.
          aws s3 cp \
            dist/SHA256SUMS \
            "s3://${S3_BUCKET}/${CANONICAL_KEY}" \
            --cache-control "public, max-age=31536000, immutable"

          # Compatibility alias only. Core consumers identify an artifact by
          # its manifest URL + SHA-256 + repository-pinned cosign signature and
          # do not consume this shared checksum key.
          aws s3 cp \
            dist/SHA256SUMS \
            "s3://${S3_BUCKET}/releases/${CHANNEL}/${TAG}/SHA256SUMS" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/releases/${CHANNEL}/${TAG}/*"

      - name: Determine prerelease flag
        id: prerelease
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-alpha* || "$TAG" == *-beta* || "$TAG" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Verification

            Checksums: `curl -fsSL https://dev.enscrive.io/releases/dev/${{ github.ref_name }}/enscrive-docs/SHA256SUMS | sha256sum -c --ignore-missing`

            Signature bundle: `https://dev.enscrive.io/releases/dev/${{ github.ref_name }}/x86_64-unknown-linux-gnu/enscrive-docs.bundle`
          files: |
            dist/enscrive-docs-*
            dist/SHA256SUMS

  # ---------------------------------------------------------------------------
  # Keyless signing for the exact artifacts consumed by enscrive-deploy.
  # The binary bundle is required. The signed, repository-scoped SHA256SUMS is
  # the canonical human checksum index; the shared checksum key remains only
  # as a compatibility alias because minute-based tags can coincide by repo.
  # ---------------------------------------------------------------------------
  sign:
    name: cosign keyless signing
    needs: [build, aggregate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vendored from enscrive-runners because this public repository cannot
      # resolve an action from that private repository. The retry, digest pin,
      # and verified-cache behavior matches the fleet's canonical installer;
      # keep the digest table synchronized through reviewed changes.
      - name: Restore cached cosign binary (unverified at this point)
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cosign-verified/cosign
          key: cosign-verified-v2.5.2-${{ runner.os }}-${{ runner.arch }}
      - name: "Install cosign (ENS-1177 pattern, vendored: verify cache or fetch with retries + digest pin)"
        shell: bash
        env:
          COSIGN_VERSION: v2.5.2
          INSTALL_DIR: ${{ github.workspace }}/.cosign-verified
          RUNNER_OS_IN: ${{ runner.os }}
          RUNNER_ARCH_IN: ${{ runner.arch }}
        run: |
          set -euo pipefail
          declare -A PINNED_SHA256=(
            [v2.5.2/linux-amd64]="bcfeae05557a9f313ee4392d2f335d0ff69ebbfd232019e3736fb04999fe1734"
            [v2.5.2/linux-arm64]="2cbcea1873ad76274c3f241ef175d204654e3aac3e73e6ec4504e5227015cb0a"
            [v2.5.2/darwin-amd64]="0681abe20a482f4b9b3ed65b3debb8c6346591f2dc484b6bfa79609ff1318de4"
            [v2.5.2/darwin-arm64]="51fdc6d8da8310d72df10065a52247b6bebfe990d4c946dd9f71e17588256011"
          )
          case "${RUNNER_OS_IN}" in
            Linux)  plat_os="linux"  ;;
            macOS)  plat_os="darwin" ;;
            *) echo "::error::vendored install-cosign-verified: unsupported runner.os '${RUNNER_OS_IN}'"; exit 1 ;;
          esac
          case "${RUNNER_ARCH_IN}" in
            X64)   plat_arch="amd64" ;;
            ARM64) plat_arch="arm64" ;;
            *) echo "::error::vendored install-cosign-verified: unsupported runner.arch '${RUNNER_ARCH_IN}'"; exit 1 ;;
          esac
          platform="${plat_os}-${plat_arch}"
          key="${COSIGN_VERSION}/${platform}"
          expected_sha256="${PINNED_SHA256[${key}]:-}"
          if [[ -z "${expected_sha256}" ]]; then
            echo "::error::vendored install-cosign-verified: no pinned digest for ${key}."
            exit 1
          fi
          mkdir -p "${INSTALL_DIR}"
          target="${INSTALL_DIR}/cosign"
          verify_sha256() {
            local actual
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            [[ "${actual}" == "${expected_sha256}" ]]
          }
          if [[ -f "${target}" ]]; then
            if verify_sha256 "${target}"; then
              echo "cache hit: cosign ${COSIGN_VERSION} (${platform}) verified — no network fetch needed."
              chmod +x "${target}"
              echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
              exit 0
            fi
            echo "::warning::vendored install-cosign-verified: cached binary failed digest verification — discarding."
            rm -f "${target}"
          fi
          url="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-${platform}"
          echo "Fetching ${url} ..."
          attempt=0
          max_attempts=3
          until curl \
            --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 3 --retry-max-time 90 \
            --connect-timeout 10 --max-time 60 \
            -o "${target}.download" \
            "${url}"; do
            attempt=$((attempt + 1))
            if [[ "${attempt}" -ge "${max_attempts}" ]]; then
              echo "::error::vendored install-cosign-verified: exhausted ${max_attempts} outer attempts fetching ${url}"
              exit 1
            fi
            backoff=$((10 * attempt))
            echo "::warning::vendored install-cosign-verified: fetch attempt ${attempt} failed, backing off ${backoff}s..."
            sleep "${backoff}"
          done
          if ! verify_sha256 "${target}.download"; then
            echo "::error::vendored install-cosign-verified: downloaded cosign does NOT match the pinned sha256. Refusing to install. expected=${expected_sha256}"
            rm -f "${target}.download"
            exit 1
          fi
          mv "${target}.download" "${target}"
          chmod +x "${target}"
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
          echo "cosign ${COSIGN_VERSION} (${platform}) fetched, verified, and installed at ${target}."

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign required binary and canonical checksum index
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          TARGET="x86_64-unknown-linux-gnu"
          WORK_DIR="/tmp/cosign-work"
          mkdir -p "${WORK_DIR}"

          BINARY_KEY="releases/${CHANNEL}/${TAG}/${TARGET}/${BINARY_NAME}"
          BINARY_LOCAL="${WORK_DIR}/${BINARY_NAME}-${TARGET}"
          aws s3 cp "s3://${S3_BUCKET}/${BINARY_KEY}" "${BINARY_LOCAL}"
          cosign sign-blob \
            --yes \
            --bundle "${BINARY_LOCAL}.bundle" \
            "${BINARY_LOCAL}"
          cosign verify-blob \
            --bundle "${BINARY_LOCAL}.bundle" \
            --certificate-identity-regexp '^https://github\.com/enscrive/enscrive-docs/\.github/workflows/release\.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${BINARY_LOCAL}"
          aws s3 cp \
            "${BINARY_LOCAL}.bundle" \
            "s3://${S3_BUCKET}/${BINARY_KEY}.bundle" \
            --cache-control "public, max-age=31536000, immutable"

          SUMS_KEY="releases/${CHANNEL}/${TAG}/${BINARY_NAME}/SHA256SUMS"
          SUMS_LOCAL="${WORK_DIR}/SHA256SUMS"
          aws s3 cp "s3://${S3_BUCKET}/${SUMS_KEY}" "${SUMS_LOCAL}"
          cosign sign-blob \
            --yes \
            --bundle "${SUMS_LOCAL}.bundle" \
            "${SUMS_LOCAL}"
          cosign verify-blob \
            --bundle "${SUMS_LOCAL}.bundle" \
            --certificate-identity-regexp '^https://github\.com/enscrive/enscrive-docs/\.github/workflows/release\.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${SUMS_LOCAL}"
          aws s3 cp \
            "${SUMS_LOCAL}.bundle" \
            "s3://${S3_BUCKET}/${SUMS_KEY}.bundle" \
            --cache-control "public, max-age=31536000, immutable"

  # ---------------------------------------------------------------------------
  # ENS-538 — notify the release orchestrator that this tag has finished
  # publishing. The orchestrator (in enscrive-cli) auto-bumps the
  # enscrive-deploy channels/dev.toml [overrides] entry for this repo and
  # dispatches manifest.yml to publish a fresh latest.json.
  #
  # A publish that cannot be pinned into the channel must be RED, not green.
  # This job used to be continue-on-error, which let a dead/unset PAT leave
  # the whole release run green while the binary was never pinned — see
  # enscrive-governance audit 2026-08-28-RELEASE-PIPELINE-SILENT-PIN-FAILURE.
  # It now fails the run so the ENS-1177 alert job below actually fires.
  #
  # Notification gates on signing so an unsigned release cannot advance the
  # dev channel manifest.
  # ---------------------------------------------------------------------------
  notify-orchestrator:
    name: notify release orchestrator (ENS-538)
    needs: [build, aggregate, sign]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Dispatch release-published to orchestrator
        env:
          ORCHESTRATOR_PAT: ${{ secrets.ENSCRIVE_ORCHESTRATOR_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${ORCHESTRATOR_PAT}" ]; then
            echo "::error::ENSCRIVE_ORCHESTRATOR_PAT not configured — binary published but NOT pinned into the dev channel (ENS-538)"
            echo "Set the secret per ENS-538 to enable auto-publish."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF_NAME="${{ github.event.inputs.ref_name }}"
          else
            REF_NAME="${GITHUB_REF_NAME}"
          fi
          REPO="${GITHUB_REPOSITORY##*/}"
          echo "Notifying orchestrator: repo=${REPO} version=${REF_NAME}"
          GH_TOKEN="${ORCHESTRATOR_PAT}" gh api -X POST \
            repos/enscrive/enscrive-cli/dispatches \
            --input - <<EOF
          {
            "event_type": "release-published",
            "client_payload": {
              "repo": "${REPO}",
              "version": "${REF_NAME}"
            }
          }
          EOF
          echo "Notification dispatched."

  # ---------------------------------------------------------------------------
  # ENS-1177 — release-failure alerting. A failed release previously went
  # silent for three weeks (ct-tui v20260709-1611 cosign fetch SPOF left
  # enscrive-probe frozen on v20260619-2225, nothing alerted). This job files
  # (or comments on) a GitHub issue whenever a required job in this workflow
  # fails, so a broken release surfaces instead of rotting quietly.
  # ---------------------------------------------------------------------------
  notify-on-failure:
    name: alert on release failure (ENS-1177)
    needs: [build, aggregate, sign, notify-orchestrator]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or update release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          REF="${GITHUB_REF_NAME}"
          TITLE="release failed: ${REF}"

          gh label create "release-failure" --repo "${REPO}" \
            --color "B60205" \
            --description "Automated: a release workflow run failed (ENS-1177)" \
            2>/dev/null || true

          EXISTING=$(gh issue list --repo "${REPO}" --label "release-failure" --state open \
            --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')

          BODY="Release workflow failed for \`${REPO}\` on ref \`${REF}\`.

          Run: ${RUN_URL}

          Filed automatically by the ENS-1177 release-failure alert job. A prior silent failure (ct-tui cosign fetch SPOF, 2026-07-09) froze enscrive-probe for three weeks with no alert — this exists so that doesn't happen again."

          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "${REPO}" --body "Recurred: ${RUN_URL}"
            echo "Commented on existing issue #${EXISTING}."
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --body "${BODY}" --label "release-failure"
            echo "Filed new release-failure issue."
          fi
