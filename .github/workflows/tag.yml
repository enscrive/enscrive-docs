name: tag-on-merge

# Auto-tag every push to main with vYYYYMMDD-HHMM UTC. The tag push itself
# starts release.yml (`on: push: tags: v*`).
#
# S1 Phase 0 (ENS-6574, Founder decision 2026-09-30): only the dedicated App
# `enscrive-release-tagger` may create, move or delete v* tags. A `v*` tag
# ruleset lists that App as its ONLY bypass actor (no admin bypass), so no
# person or agent token can push a release tag; a signed dev release therefore
# needs a merge to main.
#
# - The App key lives only in this repo's `release-tag` environment, whose
#   deployment branch policy admits `main` alone. A workflow on any other ref
#   cannot enter the environment, so it never gets the tagging identity.
# - The token is minted per run, scoped to this repository and to
#   `contents: write`, and revoked when the job ends.
# - A tag pushed by an App token (unlike GITHUB_TOKEN) triggers release.yml's
#   `push: tags`, so the old explicit `gh workflow run release.yml` dispatch
#   step is gone; keeping it would start a second, redundant release run.
# - Manual tag: run this workflow by workflow_dispatch on main. Emergency: the
#   Founder disables the v* ruleset (audit-logged).
#
# Requires, before merge: the App installed on this repo, and in environment
# `release-tag` the variable TAGGER_CLIENT_ID and the secret TAGGER_APP_KEY.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# GITHUB_TOKEN needs nothing beyond reading; the tag push uses the App token.
permissions:
  contents: read

concurrency:
  group: tag-on-merge
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-tag
    steps:
      - name: Mint a repo-scoped tagger token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAGGER_CLIENT_ID }}
          private-key: ${{ secrets.TAGGER_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Create and push vYYYYMMDD-HHMM tag
        id: tag
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          TAG="v$(date -u +%Y%m%d-%H%M)"
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG="${TAG}-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Auto-tag on merge to main: ${GITHUB_SHA}"
          git push origin "${TAG}"
          echo "Pushed ${TAG}; release.yml starts from the tag push"
